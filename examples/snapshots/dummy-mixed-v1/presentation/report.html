<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>混合资源报告</title><style>body{font:16px/1.8 sans-serif;color:#24262b;margin:0;padding:22px}h1{font-size:18px}h2{font-size:15px;font-weight:500}pre{white-space:pre-wrap;overflow-wrap:anywhere;padding:12px;background:#f4f5f7;font-size:14px}p{font-size:14px;color:#737985}</style></head><body><h1>混合资源报告</h1><p>模拟样例 · 同一个包中的 CSV、Markdown 与二进制文件</p><h2>CSV 原始数据</h2><pre id="csv"></pre><h2>二进制字节（十六进制）</h2><pre id="bytes"></pre><h2>说明</h2><p id="brief"></p><script>document.getElementById('csv').textContent=Snapshot.readText('measurements');document.getElementById('bytes').textContent=Array.from(Snapshot.readBytes('binary'),b=>b.toString(16).padStart(2,'0')).join(' ');document.getElementById('brief').textContent=Snapshot.readText('brief');</script></body></html>
